name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders, not credentials. The build only needs these
      # variables to exist; nothing in CI talks to Stripe or Supabase.
      STRIPE_SECRET_KEY: placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 2 so a pull request's merge commit can see its base (HEAD^1).
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint baseline must not grow
        if: github.event_name == 'pull_request'
        run: node .github/scripts/check-lint-baseline.mjs HEAD^1

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Proxy must be active
        run: |
          if ! grep -q "Proxy (Middleware)" "$RUNNER_TEMP/build.log"; then
            echo "::error::The build output has no 'Proxy (Middleware)' line. src/proxy.ts is the app's auth gate and must stay active."
            exit 1
          fi
